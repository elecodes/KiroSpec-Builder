version: "3.8"

services:
  kirospec:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kirospec-builder
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KIROSPEC_LLM_PROVIDER=${KIROSPEC_LLM_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OUTPUT_DIR=${OUTPUT_DIR:-.kiro/specs}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - spec-output:/app/.kiro/specs

  ollama:
    image: ollama/ollama:latest
    container_name: kirospec-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G

volumes:
  spec-output:
    driver: local
  ollama-models:
    driver: local
