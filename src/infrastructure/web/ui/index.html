<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KiroSpec Builder</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d26;
        --border: #2d3140;
        --text: #e4e6eb;
        --text-dim: #8b8f9a;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --success: #10b981;
        --error: #ef4444;
        --error-bg: #1f1315;
        --radius: 8px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

      .app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
      .app-header { text-align: center; margin-bottom: 2rem; }
      .app-header h1 { font-size: 2rem; font-weight: 700; }
      .subtitle { color: var(--text-dim); margin-top: 0.25rem; }

      .input-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
      .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
      .form-textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); font-family: inherit; font-size: 0.95rem; resize: vertical; min-height: 180px; }
      .form-textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
      .form-hint { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.5rem; }
      .form-row { display: flex; align-items: flex-end; gap: 1rem; margin-top: 1rem; }
      .form-select { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); }

      .btn-primary { padding: 0.6rem 1.5rem; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 0.95rem; }
      .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-loading { display: flex; align-items: center; gap: 0.5rem; }
      .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .error-alert { background: var(--error-bg); border: 1px solid var(--error); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
      .error-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
      .error-icon { background: var(--error); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
      .btn-dismiss { margin-left: auto; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.1rem; }
      .error-list { list-style: none; padding: 0; }
      .error-item { padding: 0.25rem 0; font-size: 0.85rem; }
      .error-category { color: var(--error); font-weight: 600; margin-right: 0.5rem; }
      .error-stage { color: var(--text-dim); margin-right: 0.5rem; }
      .btn-retry { margin-top: 0.75rem; padding: 0.4rem 1rem; background: transparent; border: 1px solid var(--error); color: var(--error); border-radius: var(--radius); cursor: pointer; font-size: 0.85rem; }

      .spec-preview { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
      .tabs { display: flex; border-bottom: 1px solid var(--border); }
      .tab { padding: 0.75rem 1.25rem; border: none; background: none; color: var(--text-dim); cursor: pointer; font-weight: 500; position: relative; }
      .tab-active { color: var(--primary); }
      .tab-active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--primary); }
      .tab-badge { width: 6px; height: 6px; background: var(--success); border-radius: 50%; display: inline-block; margin-left: 0.4rem; }
      .tab-panel { padding: 1.25rem; max-height: 500px; overflow: auto; }
      .spec-content { background: var(--bg); border-radius: var(--radius); padding: 1rem; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
      .empty-state { color: var(--text-dim); text-align: center; padding: 2rem; }
      .completion-info { text-align: center; color: var(--success); font-size: 0.85rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
